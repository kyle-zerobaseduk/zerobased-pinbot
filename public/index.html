<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PinBot V2</title>
  <style>
    :root { color-scheme: dark; --bg:#101114; --card:#1b1d22; --line:#30333b; --text:#f5f7fb; --muted:#aeb4c0; --accent:#e60023; --ok:#35c46a; --warn:#f2b84b; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { width:min(100%,980px); margin:auto; padding:18px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; }
    h1 { font-size:1.55rem; margin:0; }
    h2 { font-size:1.15rem; margin:0 0 12px; }
    .muted { color:var(--muted); font-size:.9rem; }
    .status { display:flex; gap:8px; align-items:center; }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--warn); }
    .dot.on { background:var(--ok); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
    .brand-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .badge { display:inline-block; padding:5px 9px; border-radius:999px; background:#292c33; color:var(--muted); font-size:.78rem; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
    .stat { background:#14161a; border-radius:12px; padding:10px; text-align:center; }
    .stat strong { display:block; font-size:1.15rem; }
    button, input, select, textarea { font:inherit; }
    button { border:0; border-radius:11px; padding:10px 13px; cursor:pointer; background:#343842; color:var(--text); font-weight:650; }
    button.primary { background:var(--accent); }
    button.good { background:#19733a; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    .section { margin-top:14px; }
    details { border-top:1px solid var(--line); padding-top:12px; margin-top:12px; }
    summary { cursor:pointer; font-weight:700; }
    label { display:block; color:var(--muted); font-size:.82rem; margin:10px 0 5px; }
    input, select, textarea { width:100%; background:#111318; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; }
    textarea { min-height:75px; resize:vertical; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .list { display:grid; gap:8px; margin-top:10px; }
    .item { background:#13151a; padding:10px; border-radius:10px; border:1px solid #292c32; }
    .item b { display:block; }
    .logs { max-height:300px; overflow:auto; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:.78rem; }
    .log { padding:8px 0; border-bottom:1px solid #272a31; }
    .error { color:#ff8b96; }
    .success { color:#7de89f; }
    .full { grid-column:1/-1; }
    @media (max-width:720px) { .grid { grid-template-columns:1fr; } .row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📌 PinBot V2</h1>
      <div class="muted">K.D.Publishing + ZeroBased UK</div>
    </div>
    <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Loading…</span></div>
  </header>

  <div class="card" style="margin-bottom:14px">
    <div class="brand-head">
      <div><h2>Automatic posting</h2><div id="timeText" class="muted">Checking server…</div></div>
      <button id="armBtn" class="good" onclick="toggleArm()">Loading…</button>
    </div>
  </div>

  <div id="brandGrid" class="grid"></div>

  <div class="card section">
    <h2>Recent activity</h2>
    <div id="logs" class="logs muted">No activity yet.</div>
  </div>
</div>

<script>
let brands = [];
let armed = false;

async function api(url, options={}) {
  const res = await fetch(url, { headers:{'Content-Type':'application/json'}, ...options });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function esc(value='') {
  return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

async function load() {
  try {
    const [status, brandData, logData] = await Promise.all([api('/api/status'), api('/api/brands'), api('/api/logs')]);
    brands = brandData;
    armed = status.armed;
    renderStatus(status);
    renderBrands();
    renderLogs(logData.logs || []);
  } catch (e) {
    document.getElementById('statusText').textContent = 'Server error';
    document.getElementById('logs').innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}

function renderStatus(status) {
  const dot = document.getElementById('statusDot');
  dot.classList.toggle('on', armed);
  document.getElementById('statusText').textContent = armed ? 'Auto posting ON' : 'Paused';
  const btn = document.getElementById('armBtn');
  btn.textContent = armed ? 'Pause all' : 'Start auto posting';
  btn.className = armed ? '' : 'good';
  document.getElementById('timeText').textContent = `London time ${status.londonTime || '—'} · checks every minute`;
}

function renderBrands() {
  const grid = document.getElementById('brandGrid');
  grid.innerHTML = brands.map(b => `
    <section class="card" id="brand-${esc(b.id)}">
      <div class="brand-head">
        <div>
          <h2>${b.id === 'kd-publishing' ? '📚' : '💷'} ${esc(b.name)}</h2>
          <div class="muted">Pinterest → ${esc(b.destination)}</div>
        </div>
        <span class="badge">${b.enabled ? 'ON' : 'OFF'}</span>
      </div>
      <div class="stats">
        <div class="stat"><strong>${b.products}</strong><span class="muted">Products</span></div>
        <div class="stat"><strong>${b.images}</strong><span class="muted">Images</span></div>
        <div class="stat"><strong>${b.pinsToday}</strong><span class="muted">Today</span></div>
      </div>
      <div class="muted" style="margin-bottom:10px">Pinterest: <span class="${b.pinterestConfigured?'success':'error'}">${b.pinterestConfigured?'token configured':'needs connection'}</span></div>
      <div class="muted" style="margin-bottom:12px">Schedule: ${esc((b.schedule?.slots||[]).join(' · '))} · max ${b.schedule?.maxPerDay || 3}/day</div>
      <div class="actions">
        <button onclick="toggleBrand('${b.id}', ${!b.enabled})">${b.enabled?'Turn off':'Turn on'}</button>
        <button onclick="loadBoards('${b.id}')">Load boards</button>
        <button class="primary" onclick="postNow('${b.id}')">Post now</button>
      </div>

      <details>
        <summary>Add product</summary>
        <label>Product / book name</label><input id="name-${b.id}" placeholder="e.g. Classic Motorcycles Word Search" />
        <label>${b.destination} link</label><input id="link-${b.id}" placeholder="https://…" />
        <label>Keywords (comma separated)</label><input id="keywords-${b.id}" placeholder="motorcycles, word search, gifts" />
        <label>Pinterest board</label><select id="board-${b.id}"><option value="">Load boards first</option></select>
        <label>Approved descriptions (optional, one per line)</label><textarea id="descriptions-${b.id}" placeholder="PinBot can rotate these instead of generating fresh copy."></textarea>
        <div class="actions" style="margin-top:10px"><button class="good" onclick="addProduct('${b.id}')">Save product</button></div>
        <div id="products-${b.id}" class="list"></div>
      </details>

      <details>
        <summary>Add Pin image</summary>
        <label>Product</label><select id="imageProduct-${b.id}"><option value="">Loading products…</option></select>
        <label>Public image URL</label><input id="imageUrl-${b.id}" placeholder="https://…/pin-image.jpg" />
        <div class="actions" style="margin-top:10px"><button class="good" onclick="addImage('${b.id}')">Save image</button></div>
      </details>
    </section>
  `).join('');

  brands.forEach(b => loadProducts(b.id));
}

async function toggleArm() {
  try { await api('/api/arm', {method:'POST', body:JSON.stringify({armed:!armed})}); await load(); }
  catch(e) { alert(e.message); }
}

async function toggleBrand(id, enabled) {
  try { await api(`/api/brands/${id}`, {method:'PATCH', body:JSON.stringify({enabled})}); await load(); }
  catch(e) { alert(e.message); }
}

async function loadBoards(id) {
  try {
    const boards = await api(`/api/boards/${id}`);
    const select = document.getElementById(`board-${id}`);
    select.innerHTML = '<option value="">Choose a board…</option>' + boards.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join('');
    alert(`Loaded ${boards.length} Pinterest boards.`);
  } catch(e) { alert(e.message); }
}

async function loadProducts(id) {
  try {
    const products = await api(`/api/products?brandId=${encodeURIComponent(id)}`);
    const list = document.getElementById(`products-${id}`);
    list.innerHTML = products.length ? products.map(p=>`<div class="item"><b>${esc(p.name)}</b><span class="muted">${esc(p.link)}</span></div>`).join('') : '<div class="muted">No products added yet.</div>';
    const select = document.getElementById(`imageProduct-${id}`);
    select.innerHTML = '<option value="">Choose a product…</option>' + products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  } catch(e) { console.error(e); }
}

async function addProduct(id) {
  const name = document.getElementById(`name-${id}`).value.trim();
  const link = document.getElementById(`link-${id}`).value.trim();
  const boardId = document.getElementById(`board-${id}`).value;
  const keywords = document.getElementById(`keywords-${id}`).value.split(',').map(s=>s.trim()).filter(Boolean);
  const descriptions = document.getElementById(`descriptions-${id}`).value.split('\n').map(s=>s.trim()).filter(Boolean);
  if (!name || !link) return alert('Add the product name and link first.');
  try {
    await api('/api/products', {method:'POST', body:JSON.stringify({brandId:id,name,link,boardId,keywords,descriptions})});
    await load();
  } catch(e) { alert(e.message); }
}

async function addImage(id) {
  const productId = document.getElementById(`imageProduct-${id}`).value;
  const url = document.getElementById(`imageUrl-${id}`).value.trim();
  if (!productId || !url) return alert('Choose a product and add the image URL.');
  try {
    await api('/api/images', {method:'POST', body:JSON.stringify({brandId:id,productId,url})});
    document.getElementById(`imageUrl-${id}`).value='';
    await load();
  } catch(e) { alert(e.message); }
}

async function postNow(id) {
  if (!confirm('Create and publish one Pinterest Pin now?')) return;
  try {
    const pin = await api(`/api/post-now/${id}`, {method:'POST', body:'{}'});
    alert(`Pin published: ${pin.id}`);
    await load();
  } catch(e) { alert(e.message); }
}

function renderLogs(logs) {
  const el = document.getElementById('logs');
  if (!logs.length) return el.textContent='No activity yet.';
  el.innerHTML = logs.map(l=>`<div class="log ${String(l.message).includes('ERROR')?'error':''}">${esc(new Date(l.timestamp).toLocaleString())} · ${esc(l.brandId)} · ${esc(l.message)}</div>`).join('');
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
